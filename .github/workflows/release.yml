name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space for multi-arch builds
        run: |
          sudo rm -rf /var/lib/{apt,docker}/{cache,plugins} /var/cache/{apt,apt-languagetools,debconf}
          docker builder prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/ryang3d/timelapse-creator-backend:${{ github.ref_name }}
            ghcr.io/ryang3d/timelapse-creator-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ryang3d/timelapse-creator-frontend:${{ github.ref_name }}
            ghcr.io/ryang3d/timelapse-creator-frontend:latest
