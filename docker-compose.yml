services:
  backend:
    image: ghcr.io/ryang3d/timelapse-creator-backend:latest
    build:
      context: ./backend
    ports:
      - "3001:3001"   # API
      - "3002:3002"   # WebSocket (required by the frontend, do not remove)
    volumes:
      - ./data/snapshots:/app/snapshots
      - ./data/videos:/app/videos
      - ./data/db:/app/data
      - ./data/photo-import:/mnt/photo_import
    environment:
      NODE_ENV: production
      PORT: "3001"
      WS_PORT: "3002"
      IMPORT_PARENT_PATH: /mnt/photo_import
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-}
      MQTT_PORT: ${MQTT_PORT:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      FRIGATE_API_URL: ${FRIGATE_API_URL:-}
      FRIGATE_RTSP_HOST: ${FRIGATE_RTSP_HOST:-}
      FRIGATE_API_TOKEN: ${FRIGATE_API_TOKEN:-}
    restart: unless-stopped
    networks:
      - timelapse

  frontend:
    image: ghcr.io/ryang3d/timelapse-creator-frontend:latest
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-}
    ports:
      - "3011:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - timelapse

networks:
  timelapse:
    driver: bridge
